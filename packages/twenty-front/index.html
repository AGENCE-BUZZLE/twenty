<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/png"
      href="/images/favicon-crm-buzzle.png?v=3"
      data-rh="true"
    />
    <!-- iOS home-screen : icône dédiée OPAQUE 180x180 (fond noir plein,
         pas de transparence ni de query string, sinon iOS retombe sur la
         lettre "B"). iOS applique son propre masque arrondi. -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="/apple-touch-icon.png"
    />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#14141c" />
    <!-- PWA installée : barre de statut sombre cohérente avec le shell
         Ink sur tous les écrans (login inclus). iOS → black (barre
         sombre, texte blanc) ; Android → theme-color #14141c. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Buzzle CRM" />
    <meta name="description" content="CRM Buzzle — leads Google Ads & Meta Ads" />
    <meta
      property="og:image"
      content="/images/favicon-crm-buzzle.png?v=3"
    />
    <meta property="og:description" content="CRM Buzzle — leads Google Ads & Meta Ads" />
    <meta property="og:title" content="Buzzle CRM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/images/favicon-crm-buzzle.png?v=3"
    />

    <meta name="twitter:description" content="CRM Buzzle — leads Google Ads & Meta Ads" />
    <meta name="twitter:title" content="Buzzle CRM" />
    <title>Buzzle CRM</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Buzzle : utilisé en web-app (installé) sur iPhone/Android · on
         désactive tout zoom (pinch + zoom-au-focus des inputs, même sur
         un placeholder) et on couvre le notch (viewport-fit=cover). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <style>
      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
