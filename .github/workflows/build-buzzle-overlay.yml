name: Build Buzzle CRM overlay image

on:
  push:
    branches: [buzzle-main]
    paths:
      - 'packages/twenty-docker/buzzle-overlay/**'
      - '.github/workflows/build-buzzle-overlay.yml'
  workflow_dispatch:
    inputs:
      twenty_tag:
        description: 'Twenty base image tag (e.g. v2.18.5)'
        required: false
        default: 'v2.18.5'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agence-buzzle/crm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=overlay-latest
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,format=short

      - name: Build and push overlay image
        uses: docker/build-push-action@v5
        with:
          context: packages/twenty-docker/buzzle-overlay
          file: packages/twenty-docker/buzzle-overlay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TWENTY_TAG=${{ inputs.twenty_tag || 'v2.18.5' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Print image digests
        run: |
          echo "Pushed tags:"
          echo "${{ steps.meta.outputs.tags }}"
